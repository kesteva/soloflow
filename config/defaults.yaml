# SoloFlow default configuration

models:
  verifier: opus
  executor: sonnet
  idea_extractor: sonnet
  task_decomposer: sonnet
  task_refiner: opus
  bug_investigator: opus
  compounder: sonnet
  researcher: sonnet
  code_reviewer: opus
  roadmap_researcher: sonnet
  roadmap_generator: opus
  sprint_initiator: sonnet
  sprint_closer: sonnet
  sprint_verifier: opus
  test_writer: sonnet
  integration_tester: sonnet
  codebase_pruner: opus
  claudemd_pruner: opus
  claude_md_reviewer: opus
  sprint_code_reviewer: opus
  compound_skeptic: opus

tester: false  # enable soloflow self-improvement feedback in /soloflow:compound (bucket E)

phases:
  clarify: true   # enable conversational clarification before extraction when input is ambiguous
  research: true  # enable external research after idea approval
  roadmap_clarify: true  # enable deep clarification before roadmap generation

limits:
  executor_retry_max: 3
  analysis_paralysis_threshold: 5  # consecutive read-only calls before forcing write
  checkpoint_interval: 3           # tasks between progress checkpoints
  max_sprint_tasks: 10
  context_limit_respawn_max: 3    # max context-limit respawns per agent per task
  max_parallel_tasks: 3           # max tasks whose full loops run concurrently in a batch; 1 = serial

# Parallelism for refinement (planner / braindump / review-queue).
#   task_refiner_parallel = when an IDEA has ≥2 tasks, run task-decomposer
#                           first then fan out N task-refiner detailers in
#                           parallel. Set false to keep the single-call
#                           whole-IDEA flow.
parallelism:
  task_refiner_parallel: true
  # Phase-level worktrees + settle-phase integrator. When true, the four phases
  # (clarify, planning, execution, compound) run in their own git worktrees at
  # .soloflow-worktrees/<phase>-<id>/ and merge back via settle-phase.js.
  # Default false during rollout; flip to true once the phase-worktree
  # machinery is exercised in your project.
  phase_worktrees: false

code_review:
  enabled: true
  review_retry_max: 1  # separate retry budget for code review improvements

sprint_code_review:
  enabled: true              # end-of-sprint aggregate reviewer; independent of per-task code_review.*

# Compound pipeline customization
#   skeptic            = run compound-skeptic agent against proposal before user review;
#                        adds per-item IMPLEMENT / DONT_IMPLEMENT verdicts and enables the
#                        "Accept skeptic's recommendations" option in Step 3.
#   claude_md_reviewer = run claude-md-reviewer on ALL C-items before presentation
#                        (Step 2.5); tightens diffs, splits rule+pattern items.
#   pending_sprints    = compound-backlog picker UX when /soloflow:compound is invoked
#                        with no argument and ≥ picker_threshold pending sprints exist.
compound:
  skeptic:
    enabled: true
  claude_md_reviewer:
    enabled: true
    pre_review_feedback_rounds: 2   # cap on compounder+reviewer re-runs per "Give feedback" cycle
  pending_sprints:
    picker_threshold: 2             # prompt with picker when ≥ N pending sprints; fewer → pick oldest silently

# TaskCompleted hook quality gate. Independent of the verifier (`verification.*`):
# this is the post-completion guardrail that runs the project's test runner and
# type checker after a TaskUpdate → completed. It exists so that obviously broken
# work can't be silently marked done, but it should never block legitimate setup
# tasks or tasks in projects whose suite needs build artifacts / browsers / a
# GUI before it can even start.
#   enabled    = master switch. false disables the gate entirely.
#   test       = run the detected test runner.
#   typecheck  = run the detected type checker.
#   skip_e2e   = when the project's `test` script is an end-to-end runner
#                (playwright/cypress/webdriver/detox/maestro/nightwatch), skip
#                it by default — these almost always need browsers and a built
#                artifact and will false-positive on every task. Flip to false
#                to opt in.
#   skip_when_unrunnable = preflight: if the runner's binary or its deps aren't
#                installed (no node_modules, no tsc, missing pytest, etc.) skip
#                with a one-line note rather than producing a failing run.
quality_gate:
  enabled: true
  test: true
  typecheck: true
  skip_e2e: true
  skip_when_unrunnable: true

verification:
  run_tests: true
  run_typecheck: true
  run_linter: true
  visual_mobile: false    # enable when maestro CLI is installed and a simulator/emulator is running
  visual_web: false       # enable when Playwright MCP is configured
  visual_macos: false     # enable when peekaboo CLI is installed (brew install steipete/tap/peekaboo) and Screen Recording + Accessibility permissions are granted
  # When true and the project is a Chromium-driveable target (Electron, Tauri,
  # Expo with web platform, Capacitor), prefer Playwright MCP over Maestro/Peekaboo
  # for UI verification. Default false — opt in only when the project's web
  # surface is a faithful proxy for the shipped UI (always true for Electron/Tauri;
  # sometimes false for Expo Web, where Platform.OS=='web' branches diverge).
  # For Expo / Capacitor the verifier auto-falls-back to Maestro when a task
  # touches `*.ios.*`, `*.android.*`, `*.native.*`, or imports native-only modules.
  visual_prefer_playwright: false
  # Optional explicit override for the Electron main entry. When null, the probe
  # autodetects from package.json#main, then common build paths
  # (dist/main.js, out/main.js, electron/main.js).
  visual_electron_main: null
  visual_mobile_app_id: null    # bundle ID for ad-hoc Maestro flows; auto-detected from existing flows when null
  visual_maestro_flow_dirs:     # directories to search for project Maestro flows
    - maestro/
    - .maestro/
    - test/maestro/
  visual_screenshot_budget: 3   # max screenshots per verification run
  visual_prefer_hierarchy: true # use maestro hierarchy (plain text) before screenshots
  # Optional Maestro flow run once per verifier session to authenticate the
  # simulator/emulator before the first visual flow. Path is relative to the
  # project root. When null, no auth pre-flight runs; a signed-out simulator
  # surfaces as a single deduplicated queue entry per dedup_key
  # (simulator_unauthenticated). Convention: ship as .maestro/fixtures/sign-in.yaml.
  visual_auth_fixture: null
  # Optional: sprint-managed dev server (e.g., Metro for React Native).
  # When enabled, sprint-initiator probes `probe_url` at sprint start. The
  # orchestrator offers to start (offline) or kill+restart (running externally)
  # the process under sprint ownership using `Bash run_in_background`. The
  # harness assigns an output_path that subagents read for bundler errors.
  # The visual-verify skill also probes this URL before Maestro setup so a
  # Metro-offline run short-circuits to `visual_mobile: skipped_metro_offline`
  # instead of wasting a full simulator/MCP setup chain.
  dev_server:
    enabled: false
    name: "dev-server"                            # display name in prompts
    probe_url: "http://localhost:8081/status"     # Metro: 8081/status
    probe_match: "packager-status:running"        # body substring required to count alive (empty = any 200)
    probe_port: 8081                              # used to kill external listener on `restart`
    start_command: "npx react-native start"
    startup_timeout_seconds: 30
  # Example — Vite:
  #   probe_url: "http://localhost:5173/"
  #   probe_match: ""
  #   probe_port: 5173
  #   start_command: "npm run dev"

git:
  # Whether /soloflow:sprint runs each invocation on a dedicated branch that
  # gets merged back into the starting branch after human review.
  # Values: always | never | prompt
  branch_per_run: prompt
  # Format string for the run branch. {timestamp} → YYYYMMDD-HHMMSS, {sprint_id} → SPRINT-NNN
  branch_name_format: "soloflow/run-{timestamp}-{sprint_id}"
  # Merge flag passed to `git merge` when merging the run branch back.
  merge_strategy: "--no-ff"

roadmap:
  research_dimensions:    # which dimensions to research (all 4 by default)
    - ecosystem
    - user-needs
    - architecture
    - risks
  default_output: ideas   # ideas|plans — default materialization when user approves

paths:
  state_dir: .soloflow
  active_dir: .soloflow/active
  archive_dir: .soloflow/archive
  sprints_dir: .soloflow/active/sprints   # per-sprint layout (PR #3)

# Cruft-detect knobs. stale_idea_days controls Scenario 9: an IDEA in
# active/ideas/ whose `created` frontmatter timestamp is older than this
# many days is surfaced for archive-or-re-clarify. Default 60 days.
cruft:
  stale_idea_days: 60

# Remote-version checking. The SessionStart hook calls check-version.js, which
# fetches .claude-plugin/plugin.json from main and caches the result at
# ~/.cache/soloflow/update-check.json. The statusline reads that cache to
# render an "update available" indicator. Disable to skip both.
update:
  enabled: true
  check_interval_hours: 24
