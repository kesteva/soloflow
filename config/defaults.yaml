# SoloFlow default configuration

models:
  verifier: opus
  executor: sonnet
  idea_extractor: sonnet
  task_refiner: opus
  compounder: sonnet
  researcher: sonnet
  code_reviewer: opus
  roadmap_researcher: sonnet
  roadmap_generator: opus
  sprint_initiator: sonnet

tester: false  # enable soloflow self-improvement feedback in /soloflow:compound (bucket E)

phases:
  clarify: true   # enable conversational clarification before extraction when input is ambiguous
  research: true  # enable external research after idea approval
  roadmap_clarify: true  # enable deep clarification before roadmap generation

limits:
  executor_retry_max: 3
  analysis_paralysis_threshold: 5  # consecutive read-only calls before forcing write
  checkpoint_interval: 3           # tasks between progress checkpoints
  max_sprint_tasks: 10
  context_limit_respawn_max: 3    # max context-limit respawns per agent per task

code_review:
  enabled: true
  run_simplify: true
  run_security_review: true
  review_retry_max: 1  # separate retry budget for code review improvements

verification:
  run_tests: true
  run_typecheck: true
  run_linter: true
  visual_mobile: false    # enable when Maestro MCP is configured
  visual_web: false       # enable when Playwright MCP is configured
  visual_maestro_flow_dirs:     # directories to search for project Maestro flows
    - maestro/
    - .maestro/
    - test/maestro/
  visual_screenshot_budget: 3   # max screenshots per verification run
  visual_prefer_hierarchy: true # use inspect_view_hierarchy before screenshots

git:
  # Whether /soloflow:executor runs each invocation on a dedicated branch that
  # gets merged back into the starting branch after human review.
  # Values: always | never | prompt
  branch_per_run: prompt
  # Format string for the run branch. {timestamp} → YYYYMMDD-HHMMSS, {sprint_id} → SPRINT-NNN
  branch_name_format: "soloflow/run-{timestamp}-{sprint_id}"
  # Merge flag passed to `git merge` when merging the run branch back.
  merge_strategy: "--no-ff"

roadmap:
  research_dimensions:    # which dimensions to research (all 4 by default)
    - ecosystem
    - user-needs
    - architecture
    - risks
  default_output: ideas   # ideas|plans — default materialization when user approves

paths:
  state_dir: .soloflow
  active_dir: .soloflow/active
  archive_dir: .soloflow/archive
  backlog: .soloflow/active/backlog.json
  sprint: .soloflow/active/sprint.json
